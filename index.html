<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Sentinel | Secure Your Prompts</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            text-align: center;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 1.1rem;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .auth-btn {
            width: 100%;
            margin-top: 10px;
            font-size: 1.1rem;
        }
        .switch-auth {
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .switch-auth a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card glass animate-fade" id="loginForm">
            <h1 class="logo">AI-Sentinel</h1>
            <p class="subtitle">Secure AI Interaction, Intercepted by Design.</p>
            
            <form id="login">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="input-field" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="input-field" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary auth-btn">Login to Dashboard</button>
            </form>

            <div class="switch-auth">
                Don't have an account? <a href="#" onclick="toggleAuth()">Create one</a>
            </div>
        </div>

        <div class="auth-card glass animate-fade" id="signupForm" style="display: none;">
            <h1 class="logo">AI-Sentinel</h1>
            <p class="subtitle">Join the mission for secure AI adoption.</p>
            
            <form id="signup">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="input-field" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Work Email</label>
                    <input type="email" class="input-field" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Create Password</label>
                    <input type="password" class="input-field" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary auth-btn">Create Account</button>
            </form>

            <div class="switch-auth">
                Already have an account? <a href="#" onclick="toggleAuth()">Login here</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        function toggleAuth() {
            const login = document.getElementById('loginForm');
            const signup = document.getElementById('signupForm');
            if(login.style.display === 'none') {
                login.style.display = 'block';
                signup.style.display = 'none';
            } else {
                login.style.display = 'none';
                signup.style.display = 'block';
            }
        }
    </script>
</body>
</html>
